<!doctype html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Categorias | EstoqueWeb</title><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-icon">⬡</span> EstoqueWeb</a><span class="account">Controle de Estoque</span></header><aside class="sidebar"><nav><a class="nav-link" href="/" data-path="/"><span class="nav-icon">⌂</span>Início</a><a class="nav-link" href="/produtos" data-path="/produtos"><span class="nav-icon">▣</span>Produtos</a><a class="nav-link" href="/categorias" data-path="/categorias"><span class="nav-icon">▤</span>Categorias</a><a class="nav-link" href="/fornecedores" data-path="/fornecedores"><span class="nav-icon">▥</span>Fornecedores</a><a class="nav-link" href="/movimentacoes" data-path="/movimentacoes"><span class="nav-icon">⇄</span>Movimentações</a><a class="nav-link" href="/usuarios" data-path="/usuarios"><span class="nav-icon">♙</span>Usuários</a></nav></aside><main class="content"><div class="page-heading"><h2>Categorias</h2><a class="btn btn-primary" href="/categorias/novo">+ Novo Categoria</a></div><p class="erro" th:if="${erro}" th:text="${erro}"></p><section class="panel"><div class="table-toolbar"><input aria-label="Pesquisar registros" class="search-input" placeholder="Pesquisar registros..." type="search"/></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Nome</th><th>Descrição</th><th>Ações</th></tr></thead><tbody><tr data-search-row="true" th:each="item : ${itens}"><td th:text="${item.nome}"></td><td th:text="${item.descricao}"></td><td><a class="btn btn-primary btn-sm" th:href="@{/categorias/editar/{id}(id=${item.id})}">Editar</a><form class="inline-form" method="post" onsubmit="return confirm('Confirma exclusão?')" th:action="@{/categorias/excluir/{id}(id=${item.id})}"><button class="btn btn-dang

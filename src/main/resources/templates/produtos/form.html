<!doctype html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Produtos | EstoqueWeb</title><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-icon">⬡</span> EstoqueWeb</a><span class="account">Controle de Estoque</span></header><aside class="sidebar"><nav><a class="nav-link" href="/" data-path="/"><span class="nav-icon">⌂</span>Início</a><a class="nav-link" href="/produtos" data-path="/produtos"><span class="nav-icon">▣</span>Produtos</a><a class="nav-link" href="/categorias" data-path="/categorias"><span class="nav-icon">▤</span>Categorias</a><a class="nav-link" href="/fornecedores" data-path="/fornecedores"><span class="nav-icon">▥</span>Fornecedores</a><a class="nav-link" href="/movimentacoes" data-path="/movimentacoes"><span class="nav-icon">⇄</span>Movimentações</a><a class="nav-link" href="/usuarios" data-path="/usuarios"><span class="nav-icon">♙</span>Usuários</a></nav></aside><main class="content"><div class="page-heading"><h2>Novo registro — Produtos</h2></div><p class="erro" th:if="${erro}" th:text="${erro}"></p><form class="editor panel" method="post" th:action="@{/produtos/salvar}" th:object="${item}"><input th:field="*{id}" type="hidden"/><label class="field">Nome<input class="form-control" required="" th:field="*{nome}" type="text"/></label><label class="field">Preço<input class="form-control" min="0" required="" step="0.01" th:field="*{preco}" type="number"/></label><label class="field">Quantidade<input class="form-control" min="0" required="" th:field="*{quantidade}" type="number"/></label><label class="field">Categoria<select class="form-control" required="" th:field="*{categoria}"><option value="">Selecione</option><option th:each="op : ${categorias}" th:text="${op.nome}" th:value="${op.id}"></option></select></label><label class="field">Fornecedor<select class="form-control" required="" th:field="*{fornecedor}"><option value="">Selecione</option><option th:each="op : ${fornecedores}" th:text="${op.nome}" th:value="${op.id}"></option></select></label><div class="erro" th:if="${#fields.hasErrors('*')}">Confira os dados informados.</div><button class="btn btn-primary">Salvar</button><a class="btn btn-secondary" href="/produtos">Cancelar</a></form></main><script src="/js/app.js" th:src="@{/js/app.js}"></script></body></html>
